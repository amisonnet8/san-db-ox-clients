name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ubuntu-latest 限定: shellcheck が windows-latest にプリインストール
  # されている保証がなく、結果も OS で変わらないため
  # (.claude/rules/testing.md)。
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make shellcheck

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 脆弱性DBの鮮度を優先し、アクションのパッチバージョンは固定しない
      # (.claude/rules/testing.md)。
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,license
          severity: HIGH,CRITICAL
          exit-code: 1
          skip-dirs: bin

  # docs/usage/*.md の <!-- doctest --> 付きの例だけを実行する
  # (.claude/rules/testing.md)。Go ツールチェーンには依存させない
  # (.claude/rules/directory-structure.md「言語ディレクトリ同士は互いに
  # 依存しない」の精神をドキュメント検証にも適用)。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-docs

  # ubuntu-latest 限定（現時点）: fetch-san-db-ox.sh は darwin/windows 向け
  # アセットにも対応済みだが、マトリクス化は他言語が揃うフェーズ⑤以降で
  # まとめて検討する（.claude/rules/directory-structure.md の「言語ディレクト
  # リ同士は互いに依存しない」を保ちつつ、CI の複雑さを今は増やさない）。
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # go/go.sum は存在しない（外部依存ゼロ、標準ライブラリのみ）。
          # 既定の cache: true は go.sum をキャッシュキーにしようとして
          # 見つからず警告になるだけなので無効化する。外部依存を追加した
          # 時点で go.sum が生まれ、そのタイミングで有効に戻す。
          cache: false
      - run: make go-build
      - run: make go-vet
      - run: make go-netcheck
      - run: make go-test

  # ubuntu-latest 限定（go ジョブと同じ理由）。バージョンはマトリクスにする
  # -- go-version-file 相当の「宣言した下限を実行時に守れているか」を保証
  # する仕組みが Python 側には無いため、requires-python の下限(3.10)と
  # 直近のマイナー版の両方を実際に実行して確かめる。
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: make python-lint
      - run: make python-typecheck
      - run: make python-netcheck
      - run: make python-test

  # ubuntu-latest 限定（go/python ジョブと同じ理由）。バージョンはマトリクス
  # にする -- package.json の engines は npm が強制しないため、宣言した
  # 下限（>=22.12、devcontainer.json 参照）を実際にそのバージョンで実行
  # して初めて保証される。python ジョブの requires-python マトリクスと
  # 同じ論拠。
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: make typescript-build
      - run: make typescript-lint
      - run: make typescript-typecheck
      - run: make typescript-netcheck
      - run: make typescript-test

  # ubuntu-latest 限定（go/python/typescript ジョブと同じ理由）。バージョンは
  # マトリクスにする -- Cargo.toml の rust-version(MSRV) は宣言でしかなく、
  # cargo 自身がその下限で実際にビルドを検証してくれるわけではないため、
  # 宣言した下限(1.85)と stable の両方を実際に走らせて初めて保証される。
  # python の requires-python / typescript の engines マトリクスと同じ論拠。
  #
  # ツールチェーンの導入にサードパーティ製アクション（dtolnay/rust-toolchain
  # 等）は使わない。ubuntu-latest ランナーには rustup がプリインストール
  # されており、rustup の2行で足りる。devcontainer.json が「公式 features
  # のみ、コミュニティ製は使わない」としている方針と同じ線引き（既存ジョブの
  # サードパーティは trivy-action 1つだけで、これは本体 CI と揃えるという
  # 明示的な理由がある）。依存ゼロなのでキャッシュ対象も target/ しか無く、
  # この規模では割に合わないため設定しない。
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["1.85", "stable"]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.rust-version }} --profile minimal --component clippy --component rustfmt
      - run: rustup default ${{ matrix.rust-version }}
      - run: make rust-build
      - run: make rust-fmt
      - run: make rust-lint
      - run: make rust-netcheck
      - run: make rust-test

  # ubuntu-latest 限定（go/python/typescript/rust ジョブと同じ理由）。バージョン
  # はマトリクスにする -- pom.xml の maven.compiler.release(17) は宣言でしか
  # なく、Maven 自身がその下限で実際にビルドを検証してくれるわけではないため、
  # 宣言した下限(17)と現行LTS(25)の両方を実際に走らせて初めて保証される。
  # python の requires-python / rust の rust-version マトリクスと同じ論拠。
  #
  # Maven は ubuntu-latest ランナーにプリインストールされており、
  # actions/setup-java@v5 が JDK の導入だけを担う（Maven 自体の導入は不要）。
  # distribution: temurin は devcontainer.json の Java feature と揃える。
  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: make java-build
      - run: make java-javadoc
      - run: make java-netcheck
      - run: make java-test
